# App theme - Slate + Teal (cohesive, professional).
[theme]
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

# Product-like feel: hide the developer toolbar (Deploy button, etc.).
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
