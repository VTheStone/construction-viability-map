# Urbanistic occupation parameters per zone — São José/SC.
#
# Source: LC 173/2024, ANEXO 20, "TABELA 01: PARÂMETROS URBANÍSTICOS —
# Macrozonas e Zonas" (PDF pp. 95-96). Keyed by INDIVIDUAL zone code: the
# vectorized polygons group co-colored subzones, so the per-point lookup
# resolves the exact code via the OCR label layer (Phase 6).
#
# Fields (null = "não se aplica" / "-" in the source table):
#   testada_min_m / area_min_m2     minimum lot frontage (m) / area (m²)
#   ca_min / ca_basico / ca_maximo  floor-area ratio; ca_maximo via outorga onerosa
#   pavimentos_max                  max floors (int, or "LIVRE" = limited by CA/setbacks)
#   to_torre_pct / to_embasamento_pct   max occupancy: tower / podium (%)
#   permeabilidade_min_pct          minimum permeable area (%)
#   notas                           footnote codes; legend transcription is TODO (M1 next step)

