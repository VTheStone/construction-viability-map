region:
  slug: sao_jose_sc
  name: "São José"
  state: SC
  ibge_code: "4216602"
  crs_local: "EPSG:31982"               # SIRGAS 2000 / UTM 22S
  bbox: [-48.72, -27.70, -48.51, -27.49]

# Current Master Plan legislation.
# São José replaced its 1985 plan in late 2024 with a new set of complementary laws.
master_plan:
  laws:
    - id: "LC 172/2024"
      role: "plano_diretor"
      date: "2024-12-18"
      url: "https://saojose.sc.gov.br/wp-content/uploads/2024/12/Lei-Complementar-172-2024-Institui-o-Plano-Diretor.pdf"
    - id: "LC 173/2024"
      role: "ordenamento_uso_ocupacao"
      date: "2024-12-18"
      url: "https://saojose.sc.gov.br/wp-content/uploads/2024/12/Lei-Complementar-173-2024-Ordenamento.pdf"
    - id: "LC 188/2025"
      role: "amendment_to_172"
      date: "2025"

data_sources:
  boundary:
    provider: ibge

  dem:
    provider: topodata
    sheet_codes:
      - "27S495"                          # covers São José metro region

  # Master Plan map annexes (LC 173/2024).
  # All 10 maps are loaded as georeferenced raster overlays the user can
  # toggle on/off in the app. Maps 02 (macrozoning) and 08 (risk) are
  # ALSO vectorized so they drive lot-level filters.
  master_plan_maps:
    provider: local
    overlay_dir: "master_plan/overlays"   # PNGs + world files live here
    maps:
      - id: "map_01"
        name: "Perímetro Urbano"
        annex: 5
        overlay: true
        vectorized: false
      - id: "map_02"
        name: "Macrozoneamento"
        annex: 6
        overlay: true
        vectorized: true                  # drives macrozone filter
      - id: "map_03"
        name: "Zoneamento"
        annex: 7
        overlay: true
        vectorized: false                 # v2 (drives detailed zoning filter)
      - id: "map_04"
        name: "Área de Especial Interesse Ambiental"
        annex: 8
        overlay: true
        vectorized: false
      - id: "map_05"
        name: "Área de Especial Interesse Urbanístico"
        annex: 9
        overlay: true
        vectorized: false
      - id: "map_06"
        name: "AEI Urbanístico e Trechos de Sistema Viário"
        annex: 10
        overlay: true
        vectorized: false
      - id: "map_07"
        name: "Equipamentos, Áreas Verdes e Espaços Livres"
        annex: 11
        overlay: true
        vectorized: false
      - id: "map_08"
        name: "Interesse Social e Áreas de Risco"
        annex: 12
        overlay: true
        vectorized: true                  # drives risk filter
      - id: "map_09"
        name: "Estratégia de Transporte e Mobilidade"
        annex: 13
        overlay: true
        vectorized: false
      - id: "map_10"
        name: "Categorias de Incomodidades"
        annex: 14
        overlay: true
        vectorized: false

  lots:
    strategy: osm_with_synthetic
    osm_building_filters:
      - "yes"
      - "residential"
      - "commercial"
      - "industrial"
      - "apartments"
      - "house"
    synthetic_params:
      target_lot_area_m2: 360
      min_lot_frontage_m: 10

features:
  slope:
    enabled: true
    thresholds:
      low: 15
      medium: 30
  app:
    enabled: true
    river_buffer_m: 30
  risk:
    enabled: false                      # v2 (depends on vectorizing Map 08)
  zoning:
    enabled: false                      # v2 (depends on vectorizing Map 03)
  distance_to_main_road:
    enabled: true